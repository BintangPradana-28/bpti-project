services:
  mysql:
    image: mysql:8.4
    container_name: bpti-mysql-8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password_bpti_2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bpti_db}
      MYSQL_USER: ${MYSQL_USER:-bpti_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-bpti_secret_2026}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u $${MYSQL_USER:-bpti_user} -p$${MYSQL_PASSWORD:-bpti_secret_2026}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
